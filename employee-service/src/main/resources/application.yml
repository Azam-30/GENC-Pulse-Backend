spring:
  application:
    name: employee-service
  datasource:
    url: jdbc:mysql://localhost:3306/genc_pulse_employees
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

server:
  port: 8081

jwt:
  secret: genc-pulse-secret-key-for-jwt-token-generation-minimum-32-chars
  expiration: 86400000

logging:
  level:
    com.example: DEBUG
