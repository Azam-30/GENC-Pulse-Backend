# ==========================================
# Application
# ==========================================

spring.application.name=ApiGateway
server.port=8008

# Required for Gateway WebFlux
spring.main.web-application-type=reactive

# ==========================================
# Eureka
# ==========================================

eureka.client.service-url.defaultZone=http://localhost:8001/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ==========================================
# Actuator
# ==========================================

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ==========================================
# Gateway Logging
# ==========================================

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.cloud.gateway.route=DEBUG
logging.level.org.springframework.web=INFO

# ==========================================
# Employee Service
# ==========================================

spring.cloud.gateway.server.webflux.routes[0].id=employee-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://EMPLOYEESERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/employees/**

# ==========================================
# Progress Service
# ==========================================

spring.cloud.gateway.server.webflux.routes[1].id=progress-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://PROGRESSSERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/progress/**

# ==========================================
# Commit Service
# ==========================================

spring.cloud.gateway.server.webflux.routes[2].id=commit-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://COMMITSERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/commits/**

# ==========================================
# Analytics Service
# ==========================================

spring.cloud.gateway.server.webflux.routes[3].id=analytics-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://ANALYTICSSERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/analytics/**