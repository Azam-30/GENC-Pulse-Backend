spring.application.name=NOTIFICATIONSERVICE
server.port=8091

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/genc_pulse}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8001/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Configure these environment variables in the company deployment.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# 5 PM weekdays in the selected timezone; one reminder per employee per day.
gencpulse.notifications.enabled=${NOTIFICATIONS_ENABLED:true}
gencpulse.notifications.time-zone=${NOTIFICATIONS_TIME_ZONE:Asia/Kolkata}
gencpulse.notifications.escalation-missed-days=${NOTIFICATIONS_ESCALATION_MISSED_DAYS:3}
gencpulse.notifications.reminder-cron=${NOTIFICATIONS_REMINDER_CRON:0 0 17 * * MON-FRI}
management.endpoints.web.exposure.include=health,info
